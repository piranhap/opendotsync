[package]
name = "opendotsync"
version = "0.1.0"
edition = "2021"
description = "Cross-machine dotfile synchronization with intelligent merge strategies"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
tar = "0.4"
zstd = "0.13"
sha2 = "0.10"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3"
dirs = "5"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
tempfile = "3"
hostname = "0.4"
age = "0.10"

[features]
default = ["backend-local"]
backend-local = []
